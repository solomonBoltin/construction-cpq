name: Screenshot Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  screenshot-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      working-directory: ./frontend
        
    - name: Install Playwright
      run: npx playwright install --with-deps
      working-directory: ./frontend
    
    - name: Create .env file
      run: |
        cat > .env << 'EOF'
        POSTGRES_USER=cpq_user
        POSTGRES_PASSWORD=cpq_password
        POSTGRES_DB=cpq_db
        POSTGRES_PORT=5432
        BACKEND_PORT=8000
        FRONTEND_PORT=3000
        NC_PORT=8080
        NC_AUTH_JWT_SECRET=test_jwt_secret
        NC_PUBLIC_URL=nocodb.localhost
        NC_ADMIN_EMAIL=admin@test.com
        NC_ADMIN_PASSWORD=admin_password
        CPQ_PUBLIC_DOMAIN=cpq.localhost
        BASE_TITLE=Base1
        SOURCE_TITLE=Base1 PG Source
        TRAEFIK_REPLICAS=0
        TRAEFIK_LOG_LEVEL=INFO
        EOF
    
    - name: Create external network
      run: docker network create traefik-network
    
    - name: Build and start services
      run: |
        docker compose up -d cpq_db backend frontend
        sleep 45
        
    - name: Wait for services to be ready
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        timeout 120 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
        
    - name: Run screenshot tests
      run: |
        npm run test:screenshots
      working-directory: ./frontend
      
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: |
          frontend/screenshots/
          frontend/test-results/
        retention-days: 30
        
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
        
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v
        docker network rm traefik-network || true