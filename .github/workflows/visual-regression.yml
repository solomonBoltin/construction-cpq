name: Visual Regression Tests

on:
  pull_request:
    branches: [main, master]

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Run Playwright visual tests
      working-directory: ./frontend
      run: npm run test
      continue-on-error: true
      
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: |
          frontend/test-results/**/*.png
          frontend/playwright-report/**/*.png
        retention-days: 30
        
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-visual
        path: frontend/playwright-report/
        retention-days: 30
        
    - name: Comment PR with screenshots
      uses: actions/github-script@v7
      if: always() && github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          let comment = '## 🖼️ Visual Test Results\n\n';
          comment += 'Screenshots have been taken and uploaded as artifacts.\n\n';
          comment += '### Available Downloads:\n';
          comment += '- [📊 Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
          comment += '- [📸 Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n';
          comment += '### Test Status:\n';
          comment += 'Check the action run details for test results and visual comparisons.\n\n';
          comment += '---\n';
          comment += '*Generated by GitHub Actions Screenshot Workflow*';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });