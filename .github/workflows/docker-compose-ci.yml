name: Docker Compose CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create .env file
      run: |
        cat > .env << 'EOF'
        POSTGRES_USER=cpq_user
        POSTGRES_PASSWORD=cpq_password
        POSTGRES_DB=cpq_db
        POSTGRES_PORT=5432
        BACKEND_PORT=8000
        FRONTEND_PORT=3000
        NC_PORT=8080
        NC_AUTH_JWT_SECRET=test_jwt_secret
        NC_PUBLIC_URL=nocodb.localhost
        NC_ADMIN_EMAIL=admin@test.com
        NC_ADMIN_PASSWORD=admin_password
        CPQ_PUBLIC_DOMAIN=cpq.localhost
        BASE_TITLE=Base1
        SOURCE_TITLE=Base1 PG Source
        TRAEFIK_REPLICAS=0
        TRAEFIK_LOG_LEVEL=INFO
        EOF
    
    - name: Create external network
      run: docker network create traefik-network
    
    - name: Build and start services
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d cpq_db backend
        sleep 30
        
    - name: Check backend health
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        
    - name: Run E2E tests
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build e2e_tests
        
    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
        docker network rm traefik-network || true